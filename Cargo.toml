[package]
name = "rosy-guard"
version = "0.1.0"
edition = "2021"
description = "Rosy Guard — a Discord Bot that blocks gender specific images, NSFW and gore photos and links"
authors = ["2pineapples <44606328-2pineapples@users.noreply.gitlab.com>", "nexverse404 <308237607+nexverse404@users.noreply.github.com>"]
license = "GPL-3.0"
repository = "https://github.com/nexverse404/rosy"
homepage = "https://github.com/nexverse404/rosy"
keywords = ["discord", "bot", "moderation", "nsfw", "serenity"]
categories = ["api-bindings"]

[[bin]]
name = "rosy"
path = "src/main.rs"

[dependencies]
serenity = { version = "0.12.4", default-features = false, features = ["client", "gateway", "rustls_backend", "model", "cache", "standard_framework", "http", "collector"] }
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "time", "fs"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
tldextract = "0.7"
once_cell = "1.19"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
bytes = "1.6"
url = "2.5"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
lru = "0.12"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[features]
default = []
onnx = ["dep:ort"]
